<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página Protegida</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: url('https://raw.githubusercontent.com/carlos-ai-images/bg-desenhando/main/bg-cel.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: white;
      max-width: 90%;
      width: 360px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .lock {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 14px;
      color: green;
      font-weight: bold;
    }

    .lock img {
      width: 18px;
      height: 18px;
      margin-right: 8px;
    }

    h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background-color: #f90;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #e07b00;
    }

    @media (min-width: 768px) {
      .container {
        width: 450px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="container">
    <div class="lock">
      <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="cadeado">
      Página segura e protegida
    </div>

    <h2>Para continuar, confirme que aceita nossa política de cookies:</h2>

    <a class="btn" href="https://go.hotmart.com/L98708853F">Sim, quero acessar agora</a>
    <a class="btn" href="https://go.hotmart.com/L98708853F">Concordo e quero aproveitar</a>
    <a class="btn" href="https://go.hotmart.com/L98708853F">Ir para a página oficial</a>
  </div>
</body>
</html>
